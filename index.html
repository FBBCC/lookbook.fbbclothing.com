<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FBB Lookbook</title>
    <meta http-equiv="refresh" content="0; url=./FBB%20Clothing%20Company%20Look%20Book%20Digital.pdf" />
    <style>
      :root {
        --bg: #121212;
        --panel: #1b1b1b;
        --text: #f5f5f5;
        --muted: #bdbdbd;
        --accent: #d4af75;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .card {
        width: min(90vw, 560px);
        background: var(--panel);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 20px 45px rgba(0,0,0,0.25);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 2.5rem);
        letter-spacing: 0.04em;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.6;
      }

      a {
        display: inline-block;
        text-decoration: none;
        background: var(--accent);
        color: #111;
        padding: 12px 22px;
        border-radius: 999px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>FBB Lookbook</h1>
      <p>Opening the latest FBB collection lookbook...</p>
      <a href="./FBB%20Clothing%20Company%20Look%20Book%20Digital.pdf">Open Lookbook</a>
    </div>
  </body>
</html>
