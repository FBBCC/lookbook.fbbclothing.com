<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FBB Lookbook</title>
    <style>
      :root {
        --bg: #0d0d0d;
        --panel: #171717;
        --text: #f5f5f5;
        --muted: #bdbdbd;
        --accent: #d4af75;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 20px;
        background: var(--panel);
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }

      .brand {
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 16px;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 999px;
        color: var(--text);
        text-decoration: none;
        background: rgba(255,255,255,0.02);
        font-weight: 600;
      }

      .button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #111;
      }

      .viewer-wrap {
        flex: 1;
        width: 100%;
        height: calc(100vh - 68px);
        background: #111;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: white;
      }

      @media (max-width: 640px) {
        .topbar {
          flex-wrap: wrap;
          justify-content: center;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="brand">FBB Lookbook</div>
      <div class="actions">
        <a class="button primary" href="./FBB%20Clothing%20Company%20Look%20Book%20Digital.pdf" target="_blank" rel="noopener">Open in New Tab</a>
      </div>
    </div>

    <div class="viewer-wrap">
      <iframe
        src="./FBB%20Clothing%20Company%20Look%20Book%20Digital.pdf#toolbar=1&navpanes=1&scrollbar=1&view=FitH"
        title="FBB Lookbook PDF"
        allowfullscreen
      ></iframe>
    </div>
  </body>
</html>
